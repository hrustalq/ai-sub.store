name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production

    env:
      VPS_HOST: 5.42.126.174
      VPS_USER: ${{ vars.VPS_USER }}
      DEPLOY_PATH: /opt/ai-sub.store

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write production .env
        run: |
          umask 077
          cat > .env <<EOF
          PORT=3000
          LOG_FORMAT=json
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_DOMAIN=${{ vars.PUBLIC_BASE_URL }}
          TELEGRAM_WEBHOOK_PATH=/telegram/webhook
          PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }}
          YOOKASSA_SHOP_ID=${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY=${{ secrets.YOOKASSA_SECRET_KEY }}
          ADMIN_TELEGRAM_IDS=${{ secrets.ADMIN_TELEGRAM_IDS }}
          ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}
          GRAFANA_PORT=3001
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          EOF

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        run: ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "mkdir -p '${DEPLOY_PATH}'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '*.db' \
            --exclude '.env' \
            -e ssh \
            ./ "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/"
          scp .env "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/.env"
          ssh "${VPS_USER}@${VPS_HOST}" "chmod 600 '${DEPLOY_PATH}/.env'"

      - name: Build and start production stack
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" <<EOF
          set -e
          cd '${DEPLOY_PATH}'
          docker compose -f docker-compose.prod.yml up --build -d --remove-orphans
          EOF

      - name: Wait for application health
        run: |
          ssh -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH='/opt/ai-sub.store'
          cd "${DEPLOY_PATH}"
          for attempt in $(seq 1 36); do
            if curl -sf http://127.0.0.1:3000/health/ready >/dev/null; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for health check (${attempt}/36)..."
            sleep 5
          done
          echo "Health check failed"
          docker compose -f docker-compose.prod.yml logs app --tail 100
          exit 1
          REMOTE

      - name: Update nginx site configuration
        if: success()
        run: |
          ssh -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH='/opt/ai-sub.store'
          INSTALL_SCRIPT="${DEPLOY_PATH}/scripts/nginx/install-nginx-site.sh"
          if [[ ! -x "${INSTALL_SCRIPT}" ]]; then
            echo "nginx install script not found — run scripts/setup-nginx-certbot.sh on the VPS first"
            exit 0
          fi
          if ! sudo -n true 2>/dev/null; then
            echo "passwordless sudo is not configured — skipping nginx refresh"
            exit 0
          fi
          sudo "${INSTALL_SCRIPT}"
          REMOTE

      - name: Prune dangling images
        if: success()
        run: ssh "${VPS_USER}@${VPS_HOST}" "docker image prune -f"
